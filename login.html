<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Pro - Acceso</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">

<div class="login-card">
    <h1 class="logo" style="text-align:center; margin-bottom:0.5rem;">Finanzas<span>Pro</span></h1>
    <p class="login-subtitle">Controlá tus finanzas personales</p>

    <!-- Tab switcher -->
    <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Iniciar Sesión</button>
        <button class="auth-tab" id="tab-register">Registrarse</button>
    </div>

    <!-- Alert banner -->
    <div id="auth-alert" class="auth-alert hidden"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" class="auth-form">
        <div class="form-group">
            <label for="login-email"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="login-email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="login-password"><i class="fas fa-lock"></i> Contraseña</label>
            <div class="input-password-wrap">
                <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="toggle-pass" data-target="login-password"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <button type="submit" class="btn-login" id="btn-login-submit">
            <span class="btn-text">Entrar</span>
            <i class="fas fa-spinner fa-spin hidden btn-spinner"></i>
        </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" class="auth-form hidden">
        <div class="form-group">
            <label for="reg-email"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="reg-email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="reg-password"><i class="fas fa-lock"></i> Contraseña</label>
            <div class="input-password-wrap">
                <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
                <button type="button" class="toggle-pass" data-target="reg-password"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <div class="form-group">
            <label for="reg-password-confirm"><i class="fas fa-lock"></i> Confirmar Contraseña</label>
            <div class="input-password-wrap">
                <input type="password" id="reg-password-confirm" placeholder="Repetí tu contraseña" required autocomplete="new-password" minlength="6">
                <button type="button" class="toggle-pass" data-target="reg-password-confirm"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <button type="submit" class="btn-login" id="btn-register-submit">
            <span class="btn-text">Crear Cuenta</span>
            <i class="fas fa-spinner fa-spin hidden btn-spinner"></i>
        </button>
    </form>

    <!-- Email confirmation notice (shown after register) -->
    <div id="confirm-notice" class="confirm-notice hidden">
        <div class="confirm-icon"><i class="fas fa-envelope-open-text"></i></div>
        <h3>¡Revisa tu email!</h3>
        <p>Te enviamos un link de confirmación a <strong id="confirm-email-display"></strong>. Hacé clic en el link para activar tu cuenta y luego iniciá sesión.</p>
        <button class="btn-login" onclick="switchTab('login')">Volver a Iniciar Sesión</button>
    </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    // If already logged in, redirect to dashboard
    const authenticated = await Auth.isAuthenticated();
    if (authenticated) {
        window.location.href = 'index.html';
        return;
    }

    // ── Tab switching ────────────────────────────────────────────────────────
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const confirmNotice = document.getElementById('confirm-notice');

    window.switchTab = (tab) => {
        clearAlert();
        confirmNotice.classList.add('hidden');
        if (tab === 'login') {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        } else {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        }
    };

    tabLogin.addEventListener('click', () => switchTab('login'));
    tabRegister.addEventListener('click', () => switchTab('register'));

    // ── Password visibility toggle ───────────────────────────────────────────
    document.querySelectorAll('.toggle-pass').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.target);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });
    });

    // ── Alert helpers ────────────────────────────────────────────────────────
    const alertEl = document.getElementById('auth-alert');
    function showAlert(msg, type = 'error') {
        alertEl.textContent = msg;
        alertEl.className = `auth-alert auth-alert-${type}`;
        alertEl.classList.remove('hidden');
    }
    function clearAlert() {
        alertEl.className = 'auth-alert hidden';
        alertEl.textContent = '';
    }

    // ── Loading state helpers ────────────────────────────────────────────────
    function setLoading(btn, loading) {
        const text = btn.querySelector('.btn-text');
        const spinner = btn.querySelector('.btn-spinner');
        btn.disabled = loading;
        if (loading) { text.style.opacity = '0.5'; spinner.classList.remove('hidden'); }
        else { text.style.opacity = '1'; spinner.classList.add('hidden'); }
    }

    // ── Login ────────────────────────────────────────────────────────────────
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();
        const btn = document.getElementById('btn-login-submit');
        setLoading(btn, true);
        try {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            await Auth.login(email, password);
            window.location.href = 'index.html';
        } catch (err) {
            const msg = err.message.includes('Invalid login') || err.message.includes('invalid_credentials')
                ? 'Email o contraseña incorrectos'
                : err.message.includes('Email not confirmed')
                ? 'Debés confirmar tu email antes de iniciar sesión. Revisá tu bandeja de entrada.'
                : 'Error al iniciar sesión. Intentá nuevamente.';
            showAlert(msg, 'error');
            setLoading(btn, false);
        }
    });

    // ── Register ─────────────────────────────────────────────────────────────
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-password-confirm').value;

        if (password !== confirm) {
            showAlert('Las contraseñas no coinciden', 'error');
            return;
        }
        if (password.length < 6) {
            showAlert('La contraseña debe tener al menos 6 caracteres', 'error');
            return;
        }

        const btn = document.getElementById('btn-register-submit');
        setLoading(btn, true);
        try {
            await Auth.signUp(email, password);
            // Show confirmation notice
            registerForm.classList.add('hidden');
            document.getElementById('confirm-email-display').textContent = email;
            confirmNotice.classList.remove('hidden');
        } catch (err) {
            const msg = err.message.includes('already registered') || err.message.includes('User already registered')
                ? 'Este email ya tiene una cuenta. Iniciá sesión.'
                : 'Error al crear la cuenta. Intentá con otro email.';
            showAlert(msg, 'error');
            setLoading(btn, false);
        }
    });
});
</script>
</body>
</html>
